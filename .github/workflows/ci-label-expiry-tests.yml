name: CI label expiry tests

on:
  pull_request:
    paths:
      - .github/scripts/ci-label-expiry*.mjs
      - .github/workflows/*ci*labels*.yml
      - .github/workflows/ci-label-expiry-tests.yml
      - .github/workflows/label-check.yml
  push:
    branches: [master]
    paths:
      - .github/scripts/ci-label-expiry*.mjs
      - .github/workflows/*ci*labels*.yml
      - .github/workflows/ci-label-expiry-tests.yml
      - .github/workflows/label-check.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test .github/scripts/ci-label-expiry.test.mjs
